<!doctype html>
<meta charset="utf-8">
<title>Quince Matrix</title><meta name="claude:viewport-fit-sides" content="cover"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap"><style id="qm-css">/* Layout: sticky header, KPI strip, tabbed workspace; shop = grid of hang-tag cards */
:root{
  --bg:#F2F4F1; --surface:#FFFFFF; --sunk:#E8ECE7; --ink:#16201B; --ink-2:#47544D; --muted:#6B7871; --line:#D9DFDA;
  --accent:#1E5B4F; --accent-ink:#FFFFFF; --accent-soft:#DCEBE6;
  --red:#C2362B; --red-bg:#FBE7E4; --red-ink:#8E2119;
  --yellow:#E2B007; --yellow-bg:#FDF3CF; --yellow-ink:#7A5A00;
  --green:#2F8A57; --green-bg:#DFF1E6; --green-ink:#1C5E39;
  --empty:#8A948F; --empty-bg:#ECEFEC;
  --shadow:0 1px 2px rgba(22,32,27,.06),0 4px 14px rgba(22,32,27,.05);
  --f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --f-body:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F1412; --surface:#171E1B; --sunk:#1D2622; --ink:#E5ECE8; --ink-2:#B5C1BB; --muted:#8C9993; --line:#2A3531;
  --accent:#73C2AC; --accent-ink:#0F1412; --accent-soft:#1F3631;
  --red:#F07167; --red-bg:#3A1D1A; --red-ink:#FFB4AC;
  --yellow:#F2C94C; --yellow-bg:#382E10; --yellow-ink:#F7DC8A;
  --green:#5CC98A; --green-bg:#16301F; --green-ink:#9FE3B9;
  --empty:#7E8A84; --empty-bg:#1F2724;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1412; --surface:#171E1B; --sunk:#1D2622; --ink:#E5ECE8; --ink-2:#B5C1BB; --muted:#8C9993; --line:#2A3531;
  --accent:#73C2AC; --accent-ink:#0F1412; --accent-soft:#1F3631;
  --red:#F07167; --red-bg:#3A1D1A; --red-ink:#FFB4AC;
  --yellow:#F2C94C; --yellow-bg:#382E10; --yellow-ink:#F7DC8A;
  --green:#5CC98A; --green-bg:#16301F; --green-ink:#9FE3B9;
  --empty:#7E8A84; --empty-bg:#1F2724;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
.wrap{max-width:1280px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.mono{font-family:var(--f-mono)}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:16px;padding-block:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px;min-width:0;flex:1 1 280px}
.mark{width:40px;height:40px;border-radius:10px;background:var(--ink);color:var(--surface);display:grid;place-items:center;font-family:Georgia,serif;font-size:24px;flex:none}
.brand h1{font-size:20px;font-weight:700}
.brand p{margin:0;color:var(--muted);font-size:12.5px}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 12px;cursor:pointer;display:inline-flex;gap:6px;align-items:center;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--ink-2)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn svg{width:16px;height:16px}
.viewonly{font-size:12px;color:var(--muted);border:1px dashed var(--line);border-radius:999px;padding:4px 10px}

/* KPIs */
.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px;padding-block:20px 8px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;min-width:0}
.kpi .l{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.kpi .v{font-family:var(--f-display);font-size:28px;font-weight:700;margin-top:4px;font-variant-numeric:tabular-nums;line-height:1.1}
.kpi .s{font-size:12px;color:var(--ink-2);margin-top:2px}
@media (max-width:1000px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:560px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.kpi .v{font-size:23px}}

/* rule legend + tabs */
.bar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding-block:12px}
.tabs{display:flex;gap:4px;background:var(--sunk);padding:4px;border-radius:10px;overflow-x:auto;max-width:100%}
.tab{border:0;background:transparent;padding:7px 14px;border-radius:7px;cursor:pointer;font-weight:500;color:var(--ink-2);white-space:nowrap}
.tab[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.rules{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:12.5px;color:var(--muted)}

/* status tags */
.tag{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px 3px 8px;font-size:12px;font-weight:600;white-space:nowrap;line-height:1.4}
.tag::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.tag.red{background:var(--red-bg);color:var(--red-ink)} .tag.red::before{background:var(--red)}
.tag.yellow{background:var(--yellow-bg);color:var(--yellow-ink)} .tag.yellow::before{background:var(--yellow)}
.tag.green{background:var(--green-bg);color:var(--green-ink)} .tag.green::before{background:var(--green)}
.tag.empty{background:var(--empty-bg);color:var(--muted)} .tag.empty::before{background:var(--empty)}
.chip{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:6px;padding:1px 6px;font-family:var(--f-mono);font-size:11.5px;color:var(--ink-2);background:var(--surface);white-space:nowrap}

/* filters */
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.seg{display:flex;gap:4px;flex-wrap:wrap}
.seg button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;cursor:pointer;font-size:13px;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.search{flex:1 1 200px;min-width:0;max-width:320px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 10px}

/* section heads */
.sec{margin-block:8px 28px}
.sec-h{display:flex;align-items:baseline;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.sec-h h2{font-size:18px}
.sec-h .c{color:var(--muted);font-size:13px}

/* hang-tag cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.card{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:14px 14px 12px 12px;padding:22px 16px 14px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:10px;min-width:0}
.card::before{content:"";position:absolute;top:9px;left:50%;width:10px;height:10px;margin-left:-5px;border-radius:50%;background:var(--bg);border:1px solid var(--line)}
.card .row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.sw{width:22px;height:22px;border-radius:50%;border:1px solid rgba(0,0,0,.12);flex:none}
.card .name{display:flex;gap:10px;align-items:center;min-width:0}
.card .name b{font-size:15px;display:block}
.card .name span{font-size:12.5px;color:var(--muted);display:block}
.big{font-family:var(--f-display);font-size:40px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.big small{font-family:var(--f-body);font-size:13px;font-weight:500;color:var(--muted);margin-left:4px}
.big.red{color:var(--red)} .big.yellow{color:var(--yellow-ink)} .big.green{color:var(--green)}
.meter{height:6px;background:var(--sunk);border-radius:99px;overflow:hidden}
.meter i{display:block;height:100%;border-radius:99px;background:var(--ink-2)}
.meter.red i{background:var(--red)} .meter.yellow i{background:var(--yellow)} .meter.green i{background:var(--green)}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;font-size:12px;color:var(--muted)}
.facts b{display:block;color:var(--ink);font-size:14px;font-variant-numeric:tabular-nums}
.lot{font-size:12px;color:var(--ink-2);border-top:1px dashed var(--line);padding-top:8px}

/* empty bucket */
.bucket{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px}
.bucket h3{font-size:14px;font-weight:600;margin-bottom:10px;display:flex;gap:8px;align-items:center}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.ep{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:8px;padding:6px 10px;background:var(--bg);font-size:12.5px;min-width:0}
.ep .sw{width:14px;height:14px}
.ep em{font-style:normal;color:var(--muted)}
.bucket+.bucket{margin-top:12px}

/* tables */
.tbl-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600;background:var(--sunk);position:sticky;top:0}
td.r,th.r{text-align:right;font-variant-numeric:tabular-nums}
tr.po-h td{background:var(--bg);font-weight:600}
tbody tr:last-child td{border-bottom:0}

/* analytics */
.an{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;min-width:0}
.panel.wide{grid-column:1/-1}
.panel h3{font-size:15px;margin-bottom:2px}
.panel .sub{color:var(--muted);font-size:12.5px;margin:0 0 12px}
.chart{width:100%;overflow-x:auto}
.chart svg{display:block}
.chart text{fill:var(--muted);font-size:11px;font-family:var(--f-body)}
.chart .grid-l{stroke:var(--line);stroke-width:1}
.chart .bar-m{fill:var(--accent)}
.chart .bar-m:hover,.chart .bar-m:focus{fill:var(--ink)}
.hb{display:grid;grid-template-columns:minmax(0,170px) 1fr 48px;gap:8px 10px;align-items:center;font-size:13px}
.hb .lbl{display:flex;gap:8px;align-items:center;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hb .lbl .sw{width:12px;height:12px}
.hb .tr{height:12px;background:var(--sunk);border-radius:3px;overflow:hidden}
.hb .tr i{display:block;height:100%;background:var(--accent);border-radius:0 3px 3px 0}
.hb .v{text-align:right;font-variant-numeric:tabular-nums;color:var(--ink-2)}
.split{display:flex;height:14px;border-radius:4px;overflow:hidden;gap:2px;margin:6px 0 10px}
.split i{display:block;height:100%}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-2)}
.legend span{display:inline-flex;gap:6px;align-items:center}
.legend span::before{content:"";width:10px;height:10px;border-radius:2px;background:var(--c)}
@media (max-width:820px){.an{grid-template-columns:minmax(0,1fr)}}
#tip{position:fixed;pointer-events:none;background:var(--ink);color:var(--surface);font-size:12px;padding:6px 9px;border-radius:6px;z-index:50;white-space:nowrap;box-shadow:var(--shadow)}

/* activity */
.log{display:flex;flex-direction:column;gap:8px}
.log-i{display:grid;grid-template-columns:96px 1fr auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 14px;font-size:13px}
.log-i .k{font-size:11px;text-transform:uppercase;letter-spacing:.06em;font-weight:600;color:var(--accent)}
.log-i p{margin:0;color:var(--muted);font-size:12.5px}
@media (max-width:560px){.log-i{grid-template-columns:1fr}}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(10,16,13,.45);z-index:40;display:flex;justify-content:flex-end}
.drawer{background:var(--surface);width:min(720px,100%);height:100%;overflow-y:auto;padding:20px max(20px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) 20px;display:flex;flex-direction:column;gap:16px}
.drawer-h{display:flex;justify-content:space-between;align-items:center;gap:8px}
.drawer-h h2{font-size:19px}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:12.5px;font-weight:600;color:var(--ink-2)}
.field input[type=number],.field input[type=date]{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:8px 10px;max-width:220px}
.drop{border:2px dashed var(--line);border-radius:12px;padding:24px;text-align:center;color:var(--muted);background:var(--bg);cursor:pointer}
.drop.on{border-color:var(--accent);color:var(--accent)}
.drop b{color:var(--ink)}
.note{border-radius:10px;padding:10px 12px;font-size:13px;background:var(--sunk);color:var(--ink-2)}
.note.warn{background:var(--yellow-bg);color:var(--yellow-ink)}
.note.err{background:var(--red-bg);color:var(--red-ink)}
.note.ok{background:var(--green-bg);color:var(--green-ink)}
.sumrow{display:flex;gap:8px;flex-wrap:wrap}
.sumrow .chip{font-family:var(--f-body);font-size:12.5px;padding:4px 10px;border-radius:999px}
.rule-prev{display:flex;gap:8px;flex-wrap:wrap}
.foot{color:var(--muted);font-size:12px;padding-block:24px 32px;border-top:1px solid var(--line);margin-top:24px}
@media (prefers-reduced-motion:no-preference){.card{transition:transform .15s ease,box-shadow .15s ease}.card:hover{transform:translateY(-2px)}}

function compute(st){

  var sales = st.sales.map(function(s,i){ return {d:s[0],o:s[1],s:s[2],q:s[3],a:s[4],c:s[5],i:i}; })
    .sort(function(a,b){ return a.d<b.d?-1:a.d>b.d?1:a.i-b.i; });

function readFile(f, kind){
  var prevEl=$("#prev"); prevEl.innerHTML='<div class="note">Reading '+esc(f.name)+'…</div>';
  if(!window.XLSX){ prevEl.innerHTML='<div class="note err">The spreadsheet reader did not load. Check your connection and reopen the page.</div>'; return; }
  var r=new FileReader();
  r.onload=function(){
    try{

      var m = f.name.match(/(20\d\d)-(\d\d)-(\d\d)/), m2 = f.name.match(/(\d{1,2})\.(\d{1,2})/);
      if(kind==="orders" && m) $("#ud").value = m[1]+"-"+m[2]+"-"+m[3];

      pending = kind==="insp" ? parseInspection(wb, f.name) : parseOrders(wb, f.name);

    }catch(err){ prevEl.innerHTML='<div class="note err">Could not read this file: '+esc(err.message)+'. Make sure it is the original .xlsx from the portal or the inspection form.</div>'; }
  };
  r.readAsArrayBuffer(f);
}
function rowsOf(ws){ return XLSX.utils.sheet_to_json(ws,{header:1,defval:null,raw:true}); }
function findCol(hdr, res){ for(var j=0;j<res.length;j++){ for(var i=0;i<hdr.length;i++){ if(hdr[i]!=null && res[j].test(String(hdr[i]).trim())) return i; } } return -1; }
function matchInsp(po, colour, size, skuCol, pname){
  colour = titleCase(colour); var cl = normSize(size);
  var cands = STATE.catalog.filter(function(c){ return c.colour.toUpperCase()===colour.toUpperCase() && c.cls===cl && c.pos.some(function(p){ return p.po===po; }); });
  if(skuCol) skuCol = String(skuCol).toUpperCase().replace(/[^A-Z0-9]/g,"");
  if(cands.length>1){
    if(skuCol && cands.some(function(c){ return c.sku===skuCol; })) return {sku:skuCol,note:""};
    var pn=String(pname||"").toLowerCase(), keys=[["sham","Sham Set"],["duvet cover set","Duvet Cover Set"],["duvet","Duvet Cover"],["throw","Waffle Throw"],["blanket","Waffle Bed Blanket"]];
    for(var k=0;k<keys.length;k++){ if(pn.indexOf(keys[k][0])>-1){ var f=cands.filter(function(c){ return c.product===keys[k][1]; }); if(f.length){ cands=f; break; } } }
  }
  if(cands.length===1){ var s=cands[0].sku; return {sku:s, note: skuCol && skuCol!==s ? "Form SKU "+skuCol+" is not on PO "+po+" for "+colour+" "+cl+"; matched "+s+" by PO" : ""}; }
  if(!cands.length && skuCol && STATE.catalog.some(function(c){ return c.sku===skuCol; })) return {sku:null, note:"PO "+po+" + "+colour+" + "+cl+" is not on the PO sheet (form says "+skuCol+")"};
  return {sku:null, note: cands.length ? "More than one SKU fits PO "+po+" + "+colour+" + "+cl : "PO "+po+" + "+colour+" + "+cl+" is not on the PO sheet"};
}
function parseInspection(wb, name){
  var lines=[], bad=[];
  wb.SheetNames.forEach(function(sn){
    var rows=rowsOf(wb.Sheets[sn]), hi=-1;
    for(var i=0;i<Math.min(rows.length,15);i++){ var r=rows[i].map(function(x){return String(x||"");}).join("|"); if(/po/i.test(r) && /colou?r/i.test(r) && /size/i.test(r)){ hi=i; break; } }
    if(hi<0) return;
    var hdr=rows[hi], cPo=findCol(hdr,[/^po/i]), cCol=findCol(hdr,[/^colou?r/i]), cSize=findCol(hdr,[/^size/i]), cSku=findCol(hdr,[/^sku/i]), cProd=findCol(hdr,[/product/i]), cQty=findCol(hdr,[/inspection\s*qty/i,/^total$/i,/qty/i]);
    for(var j=hi+1;j<rows.length;j++){
      var r=rows[j]; var po=parseInt(String(r[cPo]||"").replace(/\D/g,""),10), col=r[cCol], q=parseInt(r[cQty],10);
      if(!po || !col || !q) continue;
      var m=matchInsp(po,col,r[cSize],cSku>-1?r[cSku]:null,cProd>-1?r[cProd]:"");
      var line={po:po,colour:titleCase(col),size:String(r[cSize]),q:q,s:m.sku,n:m.note};
      (m.sku?lines:bad).push(line);
    }
  });
  return {file:name, lines:lines, bad:bad, dupFile: STATE.insp.some(function(l){ return l.f===name; })};
}
function parseOrders(wb, name){
  var known={}; STATE.sales.forEach(function(s){ if(s[4]) known[s[4]]=1; });
  var lines=[], skipped=0, bad=[], inFile={}, fmtName="";
  var inspected={}; STATE.insp.forEach(function(l){ var c=STATE.catalog.find(function(x){return x.sku===l.s;}); if(c){ var k=c.colour.toUpperCase()+"|"+c.cls; (inspected[k]=inspected[k]||{})[c.sku]=1; } });
  var skuSet={}; STATE.catalog.forEach(function(c){ skuSet[c.sku]=1; });
  wb.SheetNames.forEach(function(sn){
    var rows=rowsOf(wb.Sheets[sn]); if(!rows.length) return;
    var hi=-1; for(var i=0;i<Math.min(rows.length,10);i++){ var t=rows[i].map(function(x){return String(x||"").trim();}); if(t.indexOf("SKU")>-1 && (t.indexOf("lastMileTrackingNumber")>-1||t.indexOf("orderNumber")>-1)){hi=i;fmtName="export";break;} if(t.indexOf("S NO.")>-1 && t.indexOf("COLOUR")>-1){hi=i;fmtName="live";break;} }
    if(hi<0) return;
    var hdr=rows[hi].map(function(x){return String(x||"").trim();});
    var country="";
    for(var j=hi+1;j<rows.length;j++){
      var r=rows[j], x={}; hdr.forEach(function(h,k){ x[h]=r[k]; });
      var line;
      if(fmtName==="export"){
        if(!x.SKU) continue;
        var dest=String(x["Shipping Destination"]||"").split(",").pop().trim().toUpperCase();
        line={o:String(x.orderNumber||String(x.Tracking||"").split("-")[0]||""), s:String(x.SKU).trim().toUpperCase(), q:parseInt(x.Qty,10)||1, a:String(x.lastMileTrackingNumber||"").trim(), c:dest==="CA"?"CA":dest==="US"?"US":"", label:x.Variant||""};
      } else {
        if(typeof r[0]==="string"){ var u=r[0].toUpperCase(); if(u.indexOf("CANADA")>-1) country="CA"; else if(u.indexOf("USA")>-1) country="US"; continue; }
        if(typeof r[0]!=="number") continue;
        var q=parseInt(x["QTY (PCS)"],10); if(!q) continue;
        var k=String(x.COLOUR||"").trim().toUpperCase()+"|"+normSize(x.SIZE);
        var opts=Object.keys(inspected[k]||{});
        line={o:String(x["ORDER NO."]||""), s:opts.length===1?opts[0]:null, q:q, a:String(x["AWB NO."]||"").trim(), c:country, label:titleCase(x.COLOUR)+" / "+x.SIZE};
        if(!line.s){ bad.push({o:line.o,label:line.label,why:opts.length?"More than one SKU fits":"No inspected SKU for this colour and size"}); continue; }
      }
      if(!skuSet[line.s]){ bad.push({o:line.o,label:line.s+" "+line.label,why:"SKU not on the PO sheet"}); continue; }
      var key=line.a || (line.o+"|"+line.s+"|"+j);
      if(known[line.a] || inFile[key]){ skipped++; continue; }
      inFile[key]=1; lines.push(line);
    }
  });
  if(!fmtName) throw new Error("no order columns found (expected SKU and lastMileTrackingNumber, or S NO. and COLOUR)");
  return {file:name, lines:lines, skipped:skipped, bad:bad, format:fmtName};
}

function impactTable(by, sign){

    rows.map(function(r){ var st=status(r.after); return '<tr><td><span class="chip">'+r.s+'</span></td><td>'+(r.c?esc(r.c.colour+" · "+r.c.product+" · "+r.c.size):"")+'</td><td class="r">'+fmt(r.before)+'</td><td class="r">'+(sign>0?"+":"−")+fmt(r.d)+'</td><td class="r"><b>'+fmt(r.after)+'</b></td><td><span class="tag '+st+'">'+(st==="empty"?(r.after<0?"Below 0":"Moves to empty bucket"):statusLabel(st))+'</span></td></tr>'; }).join("")+'</tbody></table></div>';

}
function commit(){
  var p=pending; if(!p||!p.lines.length) return;
  var date=$("#ud").value; if(!date){ $("#save-msg").innerHTML='<div class="note err">Pick a date first.</div>'; return; }
  var next=clone(STATE);
  if(p.kind==="insp"){
    p.lines.forEach(function(l){ next.insp.push({d:date,f:p.file,po:l.po,s:l.s,q:l.q,n:l.n||""}); });
    var pcs=p.lines.reduce(function(a,l){return a+l.q;},0);
    next.log.push({at:todayISO(),kind:"inspection",f:p.file,pcs:pcs,n:p.lines.length+" lines, inspection date "+dlong(date)+(p.bad.length?", "+p.bad.length+" lines not matched":"")});
  } else {
    p.lines.forEach(function(l){ next.sales.push([date,l.o,l.s,l.q,l.a,l.c]); });
    var pcs2=p.lines.reduce(function(a,l){return a+l.q;},0);
    next.log.push({at:todayISO(),kind:"orders",f:p.file,pcs:pcs2,n:p.lines.length+" new lines for "+dlong(date)+", "+p.skipped+" already counted"+(p.bad.length?", "+p.bad.length+" not matched":"")});
  }
  save(next, $("#save-msg"));
}
function buildDoc(st){
  var reset = (document.head.querySelector("style")||{}).textContent || ":root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}";
  var json = JSON.stringify(st).replace(/</g,"\\u003c");
  var css = document.getElementById("qm-css").textContent, js = document.getElementById("qm-js").textContent;
  return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>'+reset+'</style></head><body>'+
    T.head + '<style id="qm-css">'+css+'</style>' + T.body +
    '<script type="application/json" id="qm-state">'+json+'<\/script>' + T.lib + '<script id="qm-js">'+js+'<\/script></body></html>';
}
function save(next, msgEl){
  if(!ARTIFACT){ msgEl.innerHTML='<div class="note err">Saving is not available in this view. Open the dashboard from your Claude account to make changes.</div>'; return; }
  next.updated = new Date().toISOString();
  var btns=document.querySelectorAll("#commit,#r-save"); btns.forEach(function(b){ b.disabled=true; });
  msgEl.innerHTML='<div class="note">Saving… everyone with the link will see the update.</div>';
  ARTIFACT.publish(buildDoc(next)).then(function(){
    msgEl.innerHTML='<div class="note ok">Saved. The dashboard is reloading with the update.</div>';
  }).catch(function(e){
    var code=e&&e.code;
    var t = code==="conflict" ? "Someone else saved a change at the same time. The page is reloading with the latest version; upload again after it loads."
      : (code==="not_writer"||code==="not_granted") ? "This view is read-only, so changes cannot be saved."
      : code==="rate_limited" ? "Too many saves in a short time. Wait a minute and try again."
      : "Could not save ("+(code||"error")+"). Try again in a moment.";
    msgEl.innerHTML='<div class="note err">'+esc(t)+'</div>';
    if(code==="not_writer"||code==="not_granted"){ CAN_EDIT=false; renderHeader(); }
    else btns.forEach(function(b){ b.disabled=false; });
  });
}
function downloadSummary(){
  var rows=[["SKU","Product","Colour","Size","PO qty","Inspected","Sold","In stock","Status","Last sale"]];
  M.skus.slice().sort(function(a,b){ return PRODUCT_ORDER.indexOf(a.product)-PRODUCT_ORDER.indexOf(b.product) || (a.sku<b.sku?-1:1); }).forEach(function(c){
    rows.push([c.sku,c.product,c.colour,c.size,c.poQty,c.insp,c.sold,c.bal,c.insp?(c.st==="empty"?"Sold out":statusLabel(c.st)):"Awaiting inspection",c.lastSale||""]);
  });
  var csv=rows.map(function(r){ return r.map(function(v){ v=String(v); return /[",]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v; }).join(","); }).join("\r\n");
  DOWNLOADS.save({filename:"Quince-shop-summary-"+(M.lastDay||todayISO())+".csv", data:"﻿"+csv}).catch(function(){});
}

/* ---------- boot ---------- */
document.querySelector(".tabs").addEventListener("click", function(e){ var b=e.target.closest(".tab"); if(!b) return; ui.tab=b.dataset.tab; try{ history.replaceState(null,"","#"+ui.tab); }catch(err){} render(); });
document.addEventListener("click", function(e){
  var o=e.target.closest("[data-open]"); if(o){ openDrawer(o.dataset.open); return; }
  var bb=e.target.closest("[data-b2b]"); if(bb){ markB2B(+bb.dataset.b2b); return; }
  if(e.target.closest("#dl")) downloadSummary();
});
var hash=(location.hash||"").slice(1); if(["shop","po","analytics","b2b","activity"].indexOf(hash)>-1) ui.tab=hash;
render();
window.QM_APP = { state: STATE, render: render, setTab: function(t){ ui.tab=t; try{ history.replaceState(null,"","#"+t); }catch(err){} render(); }, tab: function(){ return ui.tab; }, inspected: function(){ var m={}; STATE.insp.forEach(function(l){ var k=l.po+"|"+l.s; m[k]=(m[k]||0)+l.q; }); return m; } };
if(window.claude && window.claude.use){
  Promise.all([window.claude.use("artifact").catch(function(){return null;}), window.claude.use("user").catch(function(){return null;}), window.claude.use("downloads").catch(function(){return null;})]).then(function(r){
    ARTIFACT=r[0]; DOWNLOADS=r[2];
    var u=r[1];
    var p = (ARTIFACT && u) ? u.canEdit() : Promise.resolve(false);
    return Promise.resolve(p).then(function(ok){ CAN_EDIT=!!ok; renderHeader(); });
  }).catch(function(){ renderHeader(); });
}
})();
</script>
